<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Life Super App</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    
    <link rel="stylesheet" href="style.css">
</head>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-image: url('img/lyon_building_fall.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
</style>

<body>
    
    <div class="container-fluid d-flex flex-column min-vh-100">
        <div class="row flex-grow-1 align-items-center justify-content-center">
            <div class="col-12 text-center">
                <h1 class="display-1 fw-bold">Lyon College</h1>
                <h1 class="display-1 fw-bold">Resources</h1>
                <p class="lead">Here For Your Convience</p>
            </div>
        </div>
        
        
        <div class="row bottom-section">
            <div class="col-12">
                <div class="row justify-content-center g-4">
                    <!-- Cafeteria Card -->
                    <div class="col-md-4 col-lg-3">
                        <a href="cafeteria.html" class="text-decoration-none">
                            <div class="card h-100 text-center shadow-sm hover-card">
                                <div class="card-body py-5">
                                    <h2 class="card-title h3 mb-3">Edwards Commons</h2>
                                    <p class="card-text text-muted">Menus and Hours</p>
                                </div>
                            </div>
                        </a>
                    </div>
                    
                    <!-- Coffee Shop Card -->
                    <div class="col-md-4 col-lg-3">
                        <a href="coffee.html" class="text-decoration-none">
                            <div class="card h-100 text-center shadow-sm hover-card">
                                <div class="card-body py-5">
                                    <h2 class="card-title h3 mb-3">The Salty Dog</h2>
                                    <p class="card-text text-muted">Menu and Hours</p>
                                </div>
                            </div>
                        </a>
                    </div>
                    
                    <!-- Weather Card -->
                    <div class="col-md-4 col-lg-3">
                        <a href="weather.html" class="text-decoration-none">
                            <div class="card h-100 text-center shadow-sm hover-card">
                                <div class="card-body py-5">
                                    <h2 class="card-title h3 mb-3">Weather & Daily Info Page</h2>
                                    <p class="card-text text-muted">Daily forecast and Campus Updates
                                    </p>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
